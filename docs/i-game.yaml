  clock_and_freeze_fix_2026_11_18:
    source: "Reporte del usuario: 'solo debe avanzar al moverse' + verificación CDP"
    changes:
      - "Eliminado el bucle de dt en update(dt) que llamaba a advanceClock(1) cada 16/800 ms."
      - "advanceClock(1) se llama ahora en updateEntities() justo tras partyTickStub, en el punto de i.java:1178 j(1)."
      - "resetGameState() inicializa C=100 (i.java:7139) en vez de 0."
      - "Eliminada la instrumentación diagnostico()/DIAG_META de i.js (los demás módulos conservan sus logs)."
