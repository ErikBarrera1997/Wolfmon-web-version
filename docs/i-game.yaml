    - signature: "c(itemId)"
      target: "this.calcItemEffect(itemId)"
      java: "c(int) (i.java:1568)"
      sites: "_renderUIBar"
    - signature: "e(itemId)"
      target: "this.spriteRowForId(itemId)"
      java: "e(int) (i.java:5596)"
      sites: "_renderActionIcons"
  remaining_bare_calls:
    note: >
      These calls were intentionally left unchanged: resolving them requires
      deciding semantics or correcting argument order, which is outside the
      scope of this pass. They remain candidates for silent no-ops.
    sprite_draw_legacy_order:
      - lines: "4054-4081"
        code: "c.a(x, y, spriteId, g) and a(x, y, spriteId, g)"
        why: >
          The actual API is cRes.drawSprite(spriteId, x, y, g). Changing only
          the name would require reordering arguments, which was agreed not to do.
      - lines: "4086"
        code: "a(i1, i2, h.f[bool3], paramGraphics)"
        why: "Same case: sprite drawing with Java argument order."
      - lines: "3753"
        code: "a(x, y, frameId, g) inside _playEntityAnim"
        why: "Four-argument sprite drawing; same ordering conflict."
    ambiguous_tile_overloads:
      - lines: "3768"
        code: "a(d, e)"
        why: >
          Could be the terrain color or terrain type index. The Java source
          itself mixes the h.a/h.j tables, so it cannot be mapped without
          changing behavior.
      - lines: "3964-3965"
        code: "b(x, y, 5, 0) / b(x, y, 5, 2)"
        why: >
          There are two candidate Java overloads with the same signature
          (entity lookup and tile mask), and the port does not distinguish them.
      - lines: "4174, 4184, 4196, 4207, 4218"
        code: "b(x, y, 1, 1), a(x, y, 2|6|5), a(x, y)"
        why: >
          Mixes 2-, 3-, and 4-argument overloads. The original also duplicates
          conditions of the form a(x,y,6) && !a(x,y,6).
    unnamed_helpers:
      - lines: "4179, 4189, 4201, 4212, 4247, 4262, 4276, 4291, 4302, 4312, 4322"
        code: "d(int, int)"
        why: "There is no uniquely named port for this boolean overload."
      - lines: "4831"
        code: "bool = a(i4, b2)"
        why: "The result is used as a boolean; no current helper returns that."
      - lines: "4920"
        code: "a(x, y, w, h, g)"
        why: >
          Corresponds to the public frame in i.java:4714 and has no named
          equivalent in i.js.
    intro_and_persistence:
      - lines: "4954-4980"
        code: "g/l/i/j/k/f/m/h(Graphics) and a(123,8,45,45,g)"
        why: "Intro drawing functions with no unique name assigned."
      - lines: "5315-5432"
        code: "a(byte[], int, value) / b(byte[], int, value) in writeSaveRecord"
        why: >
          Mixes int and short writes under the same name; the port has no
          single equivalent routine.
    other_collisions:
      - lines: "6603"
        code: "b(b) in leaveLevel"
        why: "Bare name that collides with local fields."
      - lines: "7348, 7436-7447"
        code: "r(int) and a(int, int) in path logic"
        why: "There is no ported overload with a unique name."
      - lines: "7831"
        code: "c(x, y) used as a boolean in storeEntityFixed"
        why: >
          c(byte,byte) was ported as addToTileListC (void); using it as a
          condition requires rewriting the logic.
  unaffected_but_still_broken:
    note: >
      The renaming does not fix the functional defects in nuevo.txt or the
      Java syntax errors that remain in i.js. The following are among those
      still present:
    items:
      - "this.h is used as both a heading and a lighting boolean."
      - "_getTerrainColor compares the i class with numbers (i === 5, i === 6, ...)."
      - "this.h.a is read from a numeric field in _drawEntityMask."
      - "resetGameState assigns arrays to this.d/this.e and then sets them back to 0."
      - "calcScore/writeSaveRecord/loadCollisionMap/initParticlePools retain Java constructs (new byte[2600], new int[...], System.gc())."
      - "loadCollisionMap uses the unresolved bare module c (c.a(63), c.b(63))."
  verification:
    - "node --check src/game/i.js -> OK."
    - "No duplicate method names remain in i.js."
    - "No tests import i.js; validation is static."
    - "Line numbers correspond to the state after this pass; recheck if lines are inserted or removed."

input_state_fix:
  date: "2026-11-18"
  symptom: >
    Pressing left/right (any key routed through keyPressed, including unmapped
    ones) froze a requestAnimationFrame handler for ~270 ms and emitted
    cursorMoveStub(-1) with h=sí.
  cause: >
    i.java declares the nine key slots as byte[] (keyPressed writes 0/1 and j()
    tests != 0). The port kept false/true but updateEntities tested
    `bCam[n] !== null`. Since `false !== null` is true, every key press marked
    all nine actions as active; the first update then ran movement, cursor,
    dialog and h-toggle branches together and corrupted the heading boolean.
  fix: >
    updateEntities now tests `this.bCam[n] === true` for all nine slots. The
    unused `_Jact` sentinel computed with the old comparison was removed.
    keyPressed and the public API were not changed.
  verification:
    - "node --check src/game/i.js -> OK."
    - "npm test -> 33/33."
    - "Render draw calls are unchanged; only HUD/tuft debug drawing was removed earlier."

log_analysis_2026_11_18:
  source: "docs/logs.txt (41 lines captured after the bCam fix)"
  confirmed_ok:
    - "H=76, skyBand=93 and ground=169: _renderTerrain/_renderTerrainInner/_drawEntityClip report OK; the sky is intact."
    - "keyPressed(code=3) now sets bCam[2] only; h advances numerically (7, 5) and no cursorMoveStub appears."
    - "The first key no longer triggers the nine bCam branches together: the input_state_fix holds."
  fixes_applied:
    numeric_byte_literals:
      cause: >
        The decompiled Java assigns boolean literals to byte fields (`z = false`,
        `i = true`, `i = false` in i.java:1011/1524/2659 equivalents). In Java
        these compile to 0/1; the JS port stored real booleans, so diagnostics
        showed `i=no` and `isDaytime` saw `false` instead of an hour.
      changes:
        - "i.js:1011 advanceTimers: this.z = 0 (was false)."
        - "i.js:1513 updateEntities: this.i = 1 (was true)."
        - "i.js:2377 advanceClock: this.i = 0 (was false)."
      effect: "The hour counter stays numeric; queueMessage/showMessageDialog log i=0/small integer instead of i=no."
    integer_clock_division:
      cause: >
        i.java:2638 computes `A = (z - 12) / 24` with Java int division, which
        truncates toward zero. JS kept the fractional result, producing
        aProgress=-0.458/-0.292/-0.417 while z < 12.
      change: "i.js:2358 uses Math.trunc((this.z - 12) / 24)."
      effect: "aProgress is now the byte value 0..30 that the bytecode expects."
    predicate_diagnostics:
      status: "histórico; la instrumentación por método se eliminó después"
      cause: >
        _isDaytime/isDaytime are predicates: returning false at hour 0 is
        correct, but DIAG_META compared only the hour range and printed DIFIERE.
      change: >
        diagnostico() aceptaba un `resultado` opcional; los predicados lo
        calculaban y lo pasaban para comparar el boolean devuelto con `6<=i<=17`.
      effect: "A legitimate night value now logs OK with resultado=no."
  still_open:
    wrong_b_overload:
      status: "parcialmente resuelto: guardia de límites"
      site: "updateEntities() -> this.canUseCurrentItemStub(b2, b3)"
      java: "i.java:1069 uses b(byte,byte), i.java:7895 = isInTileListC."
      note: >
        canUseCurrentItemStub was the no-arg b() from i.java:1618 and returned
        true unconditionally, so the player could step to (-1,-1) and then got
        stuck. It now rejects coordinates outside mapW/mapH, and the edge branch
        returns after the warning. The Java C list is still unavailable because
        loadCollisionMap() is not called and uses invalid `new short[n]`, so
        reserved-tile semantics remain unported.
    raf_violations:
      note: >
        "[Violation] requestAnimationFrame handler took <N>ms" comes from the
        browser/DevTools around the first heavy paint (20+ one-time console
        lines). No requestIdleCallback exists in src/, so that 203 ms entry is
        browser/extension noise. Neither is a gameplay exception.
  verification:
    - "node --check src/game/i.js -> OK."
    - "npm test -> 33/33."

  second_capture_2026_11_18:
    source: "docs/logs.txt reescrito (59 líneas, 04:54)"
    confirmed_ok:
      - "isDaytime/_isDaytime now log resultado=no | OK: the predicate fix works."
      - "aProgress stays 0 in the first ticks and only reaches 30 at the scripted reset; no negative values."
      - "i is numeric everywhere: queueMessage/showMessageDialog report i=0, never i=no."
      - "Movement continues after keyPressed(3): d advances 0->1->16, h stays numeric (7, 2, 7)."
      - "canUseCurrentItemStub(1,0) no longer freezes the frame; it stays a no-op gate."
    new_false_positive:
      symptom: "constructor and resetGameState reported H=indefinido, skyBand=indefinido | DIFIERE."
      cause: >
        Both diagnostics ran on method entry, before resetGameState assigns
        this.H/this.skyBand. The values were already correct a few lines later.
      fix: >
        constructor logs after resetGameState() returns; resetGameState logs at
        its end. loadTileData also logs after reading the 4-byte header (the
        early-return and catch branches still emit a line), so mapW/mapH now
        show the real 30x40 instead of undefined.
    still_open:
      - "19 requestAnimationFrame violations: DevTools/paint timing, no gameplay exception."
      - "canUseCurrentItemStub remains the wrong b() overload; see wrong_b_overload above."
    verification:
      - "node --check src/game/i.js -> OK."
      - "npm test -> 33/33."

  third_capture_2026_11_18:
    source: "docs/logs.txt (56 líneas, 05:03)"
