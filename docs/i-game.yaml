document:
  title: "Main screen comparative documentation"
  language: en
  subject: "src/game/i.js y src/game/i.java"
  purpose: >
    Describe the responsibilities of the game class, the input, update, and
    rendering flow, and the correspondences and divergences between the
    JavaScript implementation and its Java reference source.
  scope:
    included:
      - screen lifecycle
      - game updates
      - world, entities, and inventory
      - terrain, entity, and HUD rendering
      - known port differences
    excluded:
      - complete specification of game rules
      - documentation for helper classes
      - source code modifications

sources:
  original:
    path: "../src/game/i.java"
    language: java
    role: "Decompiled original reference source; read-only."
    caveat: >
      Method and field names are obfuscated and reused across overloads. To
      identify a routine, consider its signature, arguments, and context,
      not just its single-letter name.
  migration:
    path: "../src/game/i.js"
    language: javascript
    role: "Game port for the repository's browser runtime."
    caveat: >
      Combines routines and state into a single class that belonged to
      several inner classes in Java. Some fields were renamed to distinguish
      meanings that shared a letter in the decompiled code.
  related:
    screen_base: "../src/game/p.js"
    runtime: "../src/game/m.js"
    resource_facade: "../src/resources/c.js"
    j2me_random: "../src/j2me/Random.js"
    existing_flow_notes: "./i-js-flow.md"

class:
  java:
    name: "i"
    extends: "p"
    role: "Main J2ME game screen."
    rendering_api: "javax.microedition.lcdui.Graphics"
  javascript:
    export: "i"
    extends: "Screen"
    role: "Game screen on the fixed 176x208 canvas."
    rendering_api: "Graphics from the project's J2ME shim"
  porting_conventions:
    - >
      Many Java routines are represented by static methods in `i.js` and are
      invoked as `i.method.call(this, ...)` to operate on the instance state.
    - >
      Java files are behavioral references, not inputs to runtime execution
      or the build.
    - >
      Single-letter Java names can be ambiguous after classes are merged;
      descriptive JS names generally serve as functional aliases, not as
      names from the original source.

responsibilities:
  - "Maintain game and player state."
  - "Read and modify tiles, collisions, and world objects."
  - "Update entities, the clock, timers, particles, and effects."
  - "Manage inventory, health, energy, pickups, and persistence."
  - "Draw terrain, sky, entities, the minimap, and interface elements."

lifecycle:
  constructor:
    javascript: "i.constructor()"
    behavior:
      - "Calls the Screen constructor."
      - "Initializes state through resetGameState()."
  screen_entry:
    javascript: "i.screenEntered()"
    behavior: >
      The hook is present, but startup and the main game loading are coordinated
      by the runtime and game engine.
  input:
    javascript: "i.keyPressed(code)"
    behavior:
      - "Clears the previous movement-key state."
      - "Maps J2ME codes to bCam positions for movement and actions."
      - "Code 5 requests pause/menu through the event queue."
      - "Code 13 activates the branch associated with bCam[8]."
  update:
    javascript: "i.update(dt)"
    sequence:
      - "updateAmbientParticles(dt)"
      - "updatePlacementState(dt)"
      - "updateEntities(): entity AI/movement; advanceClock(1) runs only after a completed step (i.java:1178)."
      - "If __WM_DEBUG_AUTOMOVE is active, forces bCam[0]."
    clock:
      driver: "successful tile movement, not dt"
      previous_bug: >
        A dt accumulator called advanceClock(1) every 16/800 ms, so i=6/i=18
        dialogs could open without input and block updateEntities().
      initial_C: 100  # i.java:7139; was 0, which also blocked every movement step
    error_handling: >
      Several stages are isolated with try/catch and write warnings to the
      console; other render helpers catch exceptions without logging them.
  timers:
    javascript: "i.advanceTimers(dt)"
    behavior: "Advances gameplay timers through a path separate from update()."

render_pipeline:
  entry:
    javascript: "i.paintScreen(g)"
    steps:
      - "Sets the canvas clip to 176x208 and clears the background."
      - "Calls i._paintEntry.call(this, g)."
      - "No debug HUD or tuft points are drawn; diagnostics go to the console only."
  main_frame:
    javascript: "i._renderAll(g, true)"
    steps:
      - "Renders the terrain and sky."
      - "Runs entity passes in the order 1, 0, and 2."
      - "Renders the minimap."
      - "Diagnostic tuft points were removed; no toggle draws on the canvas."
  terrain:
    javascript:
      - "i._renderTerrainInner(g)"
      - "i._drawTileGradient(...)"
    behavior:
      - "Selects a scene profile based on the in-game time."
      - "Calculates colors and draws gradients with Graphics lines."
      - "At night, may draw stars and sky marks."
      - "Draws horizon elements and terrain columns."
  entities:
    javascript: "i._renderEntitiesInner(pass, g)"
    behavior:
      - "Traverses five near columns and three additional columns."
      - "Derives tile coordinates from the player's position and h."
      - "Passes 1 and 0 both call _drawEntityClip."
      - "Pass 2 calls _drawEntityMask."
      - "Then draws the horizon terrain column."
    entity_helpers:
      clipping: "i._drawEntityClip(...)"
      mask_object_overlay: "i._drawEntityMask(...)"
      object_shadow: "i._drawEntityObject(...)"
      overlay: "i._drawEntityOverlay(...)"
      animation: "i._playEntityAnim(...)"
  interface:
    methods:
      - "i._renderMinimap(...)"
      - "i._renderUIBar(...)"
      - "i._renderActionIcons(...)"
      - "i._renderInventory(...)"
      - "i._renderFullMinimap(...)"
      - "i._drawCompassMark(...)"
      - "i._drawNumber(...)"

java_to_javascript:
  lifecycle:
    - java: "i()"
      javascript: "constructor() + resetGameState()"
      purpose: "Construction and state initialization."
    - java: "keyPressed(int)"
      javascript: "keyPressed(code)"
      purpose: "J2ME keyboard input."
    - java: "update(int)"
      javascript: "update(dt)"
      purpose: "Game update."
    - java: "paintScreen(Graphics)"
      javascript: "paintScreen(g)"
      purpose: "Drawing entry point."
    - java: "resetGameState()"
      javascript: "resetGameState()"
      purpose: "Game state reset."
  world_and_gameplay:
    - java: "readTileBits(byte, byte, int, int)"
      javascript: "readTileBits(...) / tileFieldBits(...)"
      purpose: "Read encoded fields from a tile."
    - java: "loadTileData()"
      javascript: "loadTileData()"
      purpose: "Prepare tile and node data."
    - java: "loadWorldData()"
      javascript: "loadWorldData()"
      purpose: "Load world data."
    - java: "randomInt(int, int, Random)"
      javascript: "randomInt(lo, hi, rng)"
      purpose: "Choose a random integer."
    - java: "obfuscated movement and collision helpers"
      javascript: "wanderEntity(), stepEntity(), canPlaceEntity(), isWalkable()"
      purpose: "Movement and position validation."
    - java: "obfuscated inventory and item helpers"
      javascript: "addItemToInventory(), removeItemFromInventory(), updatePickups()"
      purpose: "Inventory, pickups, and their effects."
  rendering:
    - java: "d(Graphics)"
      javascript: "_renderTerrainInner(g)"
      purpose: "Main terrain/sky rendering; correspondence inferred from body and usage."
    - java: "a(int, Graphics)"
      javascript: "_renderEntitiesInner(pass, g)"
      purpose: "Column traversal and pass dispatch."
    - java: "a(byte, byte, int, int, int, int, int, Graphics)"
      javascript: "_drawEntityClip(...)"
      purpose: "Entity drawing clipped to bands."
    - java: "b(byte, byte, int, int, int, int, int, Graphics)"
      javascript: "_drawEntityMask(...)"
      purpose: "Mask pass, object, and additional layers."
    - java: "a(int, int, int, int, int, int, Graphics)"
      javascript: "_drawEntityObject(...)"
      purpose: "Draw the object/shadow associated with an entity."
    - java: "a(int, int, int, int, int, Graphics)"
      javascript: "_drawEntityOverlay(...)"
      purpose: "Entity overlay; the Java overload is identified by its body."
    - java: "a(int, int, int, int, int, Graphics, boolean)"
      javascript: "_playEntityAnim(...)"
      purpose: "Special animation selection."
    - java: "a(int, int, int, int, int, int, int, int, int, int, int, int, int, Graphics, int, boolean)"
      javascript: "renderTileColumn16(...)"
      purpose: "Color gradient by scanline."
  note: >
    In Java, many of the names above are overloads of a/b/c/d. The signature
    distinguishes the routine; descriptive JS labels alone do not prove full
    behavioral equivalence.

state_model:
  player_and_camera:
    fields:
      - "d, e: the player's current map coordinates."
      - "h: numeric heading/facing used to calculate visible columns."
      - "bCam: key/action states mapped from keyPressed()."
      - "i: in-game time or time state."
  world:
    fields:
      - "u, v, eArr, pFlag: buffers used for tiles, terrain, and visible data."
      - "mapW, mapH, and associated arrays: map dimensions and state."
      - "nodeX, nodeY, nodeKind, and related fields: world nodes/entities."
  gameplay:
    fields:
      - "A: storage for inventory items/values and related state."
      - "C, F, m, and other fields: gameplay modes and states; their meanings depend on the flow."
      - "a: the instance's J2ME Random used by randomBetween()."
      - "fxN, fxD, fxO, fxE: timed effect records in the port."
  render_tables:
    fields:
      - "hDayBounds and hNightBounds: render bounds by orientation."
      - "hPrefabs: lists of triples (dx, dy, spriteId) for terrain."
      - "hColorThresholds: color palettes/thresholds used by terrain profiles."
      - "hDirB..hDirI and hGroundProb: helper tables ported from Java class h."
  warning: >
    Do not interpret an isolated letter as a stable identity: the decompiler
    reuses fields across inner classes, and the port sometimes had to
    disambiguate them with names such as aSeed, aTiles, fFlag, prevX, and tuftX.

world_and_gameplay_areas:
  tiles_and_collision:
    methods:
      - "readTileBits(...)"
      - "tileFieldBits(...)"
      - "isWalkable(...)"
      - "canPlaceEntity(...)"
      - "isTileBlocked(...)"
      - "isInTileSet(...)"
      - "loadCollisionMap(...)"
  entities:
