      Captura limpia: cero líneas DIFIERE. constructor/resetGameState reportan
      H=76, skyBand=93 | OK y loadTileData reporta mapW=30, mapH=40,
      viewport=27x39. isDaytime/_isDaytime y advanceClock siguen en OK; i se
