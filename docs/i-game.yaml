      Con C=0 inicial, updateEntities() salía siempre por `C <= 0`: la partida
      arrancaba bloqueada. El reloj por temporizador acababa poniendo C=1 y
      disparando los diálogos de i=6/i=18 sin que el jugador se moviera, lo que
      explicaba el congelamiento repentino.
    verification:
      - "node --check src/game/i.js -> OK."
      - "npm test -> 33/33."
      - "CDP: entrada [i,0,0,0,0,0,100,false]; tras 6 s sin teclas idéntico."
      - "CDP: tecla 4 -> [i,0,-1,1,1,0,100,false]; tecla 2 solo gira, sin cambio de reloj."
      - "CDP: cero excepciones."

