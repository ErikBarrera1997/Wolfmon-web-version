      - "updateEntities()"
      - "updateEntityTimers(dt)"
      - "wanderEntity(index)"
      - "stepEntity(index, dx, dy, ...)"
      - "faceEntityTowards(index, x, y)"
      - "randomizeEntityPosition(index)"
  items_and_health:
    methods:
      - "addItemToInventory(...)"
      - "removeItemFromInventory(...)"
      - "selectItemSlot(...)"
      - "isConsumablesFull()"
      - "_calcHealth(...)"
      - "gainEnergy(...)"
      - "grantRandomLoot(...)"
