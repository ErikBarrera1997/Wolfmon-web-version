document:
  title: "Main screen comparative documentation"
  language: en
  subject: "src/game/i.js y src/game/i.java"
  purpose: >
    Describe the responsibilities of the game class, the input, update, and
    rendering flow, and the correspondences and divergences between the
    JavaScript implementation and its Java reference source.
  scope:
    included:
      - screen lifecycle
      - game updates
      - world, entities, and inventory
      - terrain, entity, and HUD rendering
      - known port differences
    excluded:
      - complete specification of game rules
      - documentation for helper classes
      - source code modifications

sources:
  original:
    path: "../src/game/i.java"
    language: java
    role: "Decompiled original reference source; read-only."
    caveat: >
      Method and field names are obfuscated and reused across overloads. To
      identify a routine, consider its signature, arguments, and context,
      not just its single-letter name.
  migration:
    path: "../src/game/i.js"
    language: javascript
    role: "Game port for the repository's browser runtime."
    caveat: >
      Combines routines and state into a single class that belonged to
      several inner classes in Java. Some fields were renamed to distinguish
      meanings that shared a letter in the decompiled code.
  related:
    screen_base: "../src/game/p.js"
    runtime: "../src/game/m.js"
    resource_facade: "../src/resources/c.js"
    j2me_random: "../src/j2me/Random.js"
    existing_flow_notes: "./i-js-flow.md"

class:
  java:
    name: "i"
    extends: "p"
    role: "Main J2ME game screen."
    rendering_api: "javax.microedition.lcdui.Graphics"
  javascript:
    export: "i"
    extends: "Screen"
    role: "Game screen on the fixed 176x208 canvas."
    rendering_api: "Graphics from the project's J2ME shim"
  porting_conventions:
    - >
      Many Java routines are represented by static methods in `i.js` and are
      invoked as `i.method.call(this, ...)` to operate on the instance state.
    - >
      Java files are behavioral references, not inputs to runtime execution
      or the build.
    - >
      Single-letter Java names can be ambiguous after classes are merged;
      descriptive JS names generally serve as functional aliases, not as
      names from the original source.

responsibilities:
  - "Maintain game and player state."
  - "Read and modify tiles, collisions, and world objects."
  - "Update entities, the clock, timers, particles, and effects."
  - "Manage inventory, health, energy, pickups, and persistence."
  - "Draw terrain, sky, entities, the minimap, and interface elements."

lifecycle:
  constructor:
    javascript: "i.constructor()"
    behavior:
      - "Calls the Screen constructor."
      - "Initializes state through resetGameState()."
  screen_entry:
    javascript: "i.screenEntered()"
    behavior: >
      The hook is present, but startup and the main game loading are coordinated
      by the runtime and game engine.
  input:
    javascript: "i.keyPressed(code)"
    behavior:
      - "Clears the previous movement-key state."
      - "Maps J2ME codes to bCam positions for movement and actions."
      - "Code 5 requests pause/menu through the event queue."
      - "Code 13 activates the branch associated with bCam[8]."
  update:
    javascript: "i.update(dt)"
    sequence:
      - "updateAmbientParticles(dt)"
      - "updatePlacementState(dt)"
      - "updateEntities(): entity AI/movement; advanceClock(1) runs only after a completed step (i.java:1178)."
      - "If __WM_DEBUG_AUTOMOVE is active, forces bCam[0]."
    clock:
      driver: "successful tile movement, not dt"
      previous_bug: >
        A dt accumulator called advanceClock(1) every 16/800 ms, so i=6/i=18
        dialogs could open without input and block updateEntities().
      initial_C: 100  # i.java:7139; was 0, which also blocked every movement step
    error_handling: >
      Several stages are isolated with try/catch and write warnings to the
      console; other render helpers catch exceptions without logging them.
  timers:
    javascript: "i.advanceTimers(dt)"
    behavior: "Advances gameplay timers through a path separate from update()."

render_pipeline:
  entry:
    javascript: "i.paintScreen(g)"
    steps:
      - "Sets the canvas clip to 176x208 and clears the background."
      - "Calls i._paintEntry.call(this, g)."
      - "No debug HUD or tuft points are drawn; diagnostics go to the console only."
  main_frame:
    javascript: "i._renderAll(g, true)"
    steps:
      - "Renders the terrain and sky and the two ground bands; the sprite-269 carpet strips stay gated by i.c."
      - "Runs entity passes in the order 1, 0, and 2."
      - "Renders the minimap."
      - "Diagnostic tuft points were removed; no toggle draws on the canvas."
  terrain:
    javascript:
      - "i._renderTerrainInner(g)"
      - "i._drawTileGradient(...)"
    behavior:
      - "Selects a scene profile based on the in-game time."
      - "Calculates colors and draws gradients with Graphics lines."
      - "At night, may draw stars and sky marks."
      - "Draws horizon elements and terrain columns."
  entities:
    javascript: "i._renderEntitiesInner(pass, g)"
    behavior:
      - "Traverses five near columns and three additional columns."
      - "Derives tile coordinates from the player's position and h."
      - "Passes 1 and 0 both call _drawEntityClip."
      - "Pass 2 calls _drawEntityMask."
      - "Then draws the horizon terrain column."
    entity_helpers:
      clipping: "i._drawEntityClip(...)"
      house_trees: "i._drawEntityHouse(...)"
      carpet: "i._paintTerrainTexture(...) / i._fillTerrainBg(...)"
      mask: "i._drawEntityMask(...)"
      object_shadow: "i._drawEntityObject(...)"
      overlay: "i._drawEntityOverlay(...) — only from _drawTerrainColumn"
      animation: "i._playEntityAnim(...)"
  interface:
    methods:
      - "i._renderMinimap(...)"
      - "i._renderUIBar(...)"
      - "i._renderActionIcons(...)"
      - "i._renderInventory(...)"
      - "i._renderFullMinimap(...)"
      - "i._drawCompassMark(...)"
      - "i._drawNumber(...)"

java_to_javascript:
  lifecycle:
    - java: "i()"
      javascript: "constructor() + resetGameState()"
      purpose: "Construction and state initialization."
    - java: "keyPressed(int)"
      javascript: "keyPressed(code)"
      purpose: "J2ME keyboard input."
    - java: "update(int)"
      javascript: "update(dt)"
      purpose: "Game update."
    - java: "paintScreen(Graphics)"
      javascript: "paintScreen(g)"
      purpose: "Drawing entry point."
    - java: "resetGameState()"
      javascript: "resetGameState()"
      purpose: "Game state reset."
  world_and_gameplay:
    - java: "readTileBits(byte, byte, int, int)"
      javascript: "readTileBits(...) / tileFieldBits(...)"
      purpose: "Read encoded fields from a tile."
    - java: "loadTileData()"
      javascript: "loadTileData()"
      purpose: "Prepare tile and node data."
    - java: "loadWorldData()"
      javascript: "loadWorldData()"
      purpose: "Load world data."
    - java: "randomInt(int, int, Random)"
      javascript: "randomInt(lo, hi, rng)"
      purpose: "Choose a random integer."
    - java: "obfuscated movement and collision helpers"
      javascript: "wanderEntity(), stepEntity(), canPlaceEntity(), isWalkable()"
      purpose: "Movement and position validation."
    - java: "obfuscated inventory and item helpers"
      javascript: "addItemToInventory(), removeItemFromInventory(), updatePickups()"
      purpose: "Inventory, pickups, and their effects."
  rendering:
    - java: "d(Graphics)"
      javascript: "_renderTerrainInner(g)"
      purpose: "Main terrain/sky rendering; correspondence inferred from body and usage."
    - java: "a(int, Graphics)"
      javascript: "_renderEntitiesInner(pass, g)"
      purpose: "Column traversal and pass dispatch."
    - java: "a(byte, byte, int, int, int, int, int, Graphics)"
      javascript: "_drawEntityClip(...)"
      purpose: "Entity drawing clipped to bands."
    - java: "b(byte, byte, int, int, int, int, int, Graphics)"
      javascript: "_drawEntityMask(...)"
      purpose: "Sprites 262-265 (rock/tree bases and night variants), object and animation; no overlay in this route."
    - java: "b(int, int, int, int, Graphics)"
      javascript: "_paintTerrainTexture(...) / _fillTerrainBg(...)"
      purpose: "Tiles sprite 269 into narrow strips beside the entity columns."
    - java: "a(int, int, int, int, int, int, Graphics)"
      javascript: "_drawEntityObject(...)"
      purpose: "Draw the object/shadow associated with an entity."
    - java: "a(int, int, int, int, int, Graphics)"
      javascript: "_drawEntityOverlay(...)"
      purpose: "Overlay 266-268/357-359; Java calls it only from _drawTerrainColumn (i.java:4613)."
    - java: "a(int, int, int, int, int, Graphics, boolean)"
      javascript: "_playEntityAnim(...)"
      purpose: "Special animation selection."
    - java: "a(int, int, int, int, int, int, int, int, int, int, int, int, int, Graphics, int, boolean)"
      javascript: "renderTileColumn16(...)"
      purpose: "Color gradient by scanline."
  note: >
    In Java, many of the names above are overloads of a/b/c/d. The signature
    distinguishes the routine; descriptive JS labels alone do not prove full
    behavioral equivalence.

state_model:
  player_and_camera:
    fields:
      - "d, e: the player's current map coordinates."
      - "h: numeric heading/facing used to calculate visible columns."
      - "bCam: key/action states mapped from keyPressed()."
      - "i: in-game time or time state."
  world:
    fields:
      - "u, v, eArr, pFlag: buffers used for tiles, terrain, and visible data."
      - "mapW, mapH, and associated arrays: map dimensions and state."
      - "nodeX, nodeY, nodeKind, and related fields: world nodes/entities."
  gameplay:
    fields:
      - "A: storage for inventory items/values and related state."
      - "C, F, m, and other fields: gameplay modes and states; their meanings depend on the flow."
      - "a: the instance's J2ME Random used by randomBetween()."
      - "fxN, fxD, fxO, fxE: timed effect records in the port."
  render_tables:
    fields:
      - "hDayBounds and hNightBounds: render bounds by orientation."
      - "hPrefabs: lists of triples (dx, dy, spriteId) for terrain."
      - "hColorThresholds: color palettes/thresholds used by terrain profiles."
      - "hDirB..hDirI and hGroundProb: helper tables ported from Java class h."
  warning: >
    Do not interpret an isolated letter as a stable identity: the decompiler
    reuses fields across inner classes, and the port sometimes had to
    disambiguate them with names such as aSeed, aTiles, fFlag, prevX, and tuftX.

world_and_gameplay_areas:
  tiles_and_collision:
    methods:
      - "readTileBits(...)"
      - "tileFieldBits(...)"
      - "isWalkable(...)"
      - "canPlaceEntity(...)"
      - "isTileBlocked(...)"
      - "isInTileSet(...)"
      - "loadCollisionMap(...)"
  entities:
    methods:
      - "updateEntities()"
      - "updateEntityTimers(dt)"
      - "wanderEntity(index)"
      - "stepEntity(index, dx, dy, ...)"
      - "faceEntityTowards(index, x, y)"
      - "randomizeEntityPosition(index)"
  items_and_health:
    methods:
      - "addItemToInventory(...)"
      - "removeItemFromInventory(...)"
      - "selectItemSlot(...)"
      - "isConsumablesFull()"
      - "_calcHealth(...)"
      - "gainEnergy(...)"
      - "grantRandomLoot(...)"
      - "updatePickups()"
  save_data:
    methods:
      - "writeSaveRecord()"
      - "calcScore()"
      - "writeIntBigEndian(...)"
      - "readIntBigEndian(...)"
      - "readShortBigEndian(...)"
      - "readBoolean(...)"
    storage: "RecordStore, mediated by the m.js runtime."

known_port_differences:
  - id: "sky-boundary"
    severity: "visual-conditional"
    status: "divergence-visible-in-source"
    java: >
      The decompiled Java initializer documents I=93 and J=I*40/100=37.
      The clipping code and the two bands use H+J; with H=76, the resulting
      limit is 113 and the sky bands extend to y=169.
    javascript: >
      resetGameState() sets H=76 and skyBand=169-H=93. _drawEntityClip()
      uses H+skyBand=169 as the clipping boundary.
    impact: >
      These expressions are not equivalent. The effect depends on an entity
      crossing that boundary; do not assume the port preserves Java's geometry.
  - id: "animation-helper-reference"
    severity: "render"
    status: "confirmed-in-source"
    javascript: >
      _playEntityAnim() invokes a(...) without qualification; a is declared as
      an uninitialized module variable. renderRegion() also retains calls to
      bare helpers such as a(...). These paths fail when executed, and some
      callers swallow the exception.
    impact: "Special animations and drawing associated with renderRegion may not appear."
  - id: "entity-overlay-arguments"
    severity: "render"
    status: "superseded"
    javascript: >
      _drawEntityMask() used to call _drawEntityOverlay() with the wrong
      arguments: (paramInt1, paramInt2, paramInt3, paramInt4, paramByte1, g)
      put the rectangle width where the helper reads the size, the literal 7
      where it reads the tile X, and omitted the tile Y. The call was corrected
      to (paramInt1, paramInt2, paramInt4, paramByte1, paramByte2, g), matching
      the (x, y, size, tileX, tileY, g) signature. That made the call execute,
      which exposed a larger fidelity problem: Java's mask (i.java:4279-4285)
      never calls the overlay overload (i.java:4313). See
      horizon-cabin-overlay-2026_11_21: the call was removed from the mask and
      only the legitimate _drawTerrainColumn route (i.java:4613) remains.
    impact: >
      The argument fix alone was wrong: it made a cabin (sprite 266) appear at
      several entity depths even when the tile had no house. After removing
      the call, resource 18 (266-268) no longer appears in entity-mask draws;
      the overlay is still reachable from terrain columns as in Java.
  - id: "entity-house-sprites"
    severity: "render"
    status: "resolved"
    java: >
      b(byte,byte,...) at i.java:4279-4285 calls b(...) at i.java:4666-4687
      first, which draws sprites 262-265 (base variants) for tiles of type 6.
    javascript: >
      _drawEntityMask() called _drawEntityClip() in that slot, so owner 17 had
      zero draws. It now calls _drawEntityHouse() with the same seven arguments
      as Java (x, y, w, h, tileX, tileY, g); the first port attempt passed eight
      arguments, so the Graphics object landed in the wrong parameter and the
      draw threw. That helper also used an uninitialized module-level `b` as a
      Random and compared the module `i` against hours; it now uses a local LCG
      seeded by tile and heading (it does not consume this.a) and compares
      this.i for the night variant.
    impact: >
      Fixed. Owner 17 sprites are reachable again without changing movement or
      the clock; the earlier zero-draw state had left the tree crowns with the
      wrong/underlying texture.
  - id: "terrain-carpet-sprite"
    severity: "render"
    status: "faithful-to-java-gated"
    java: >
      a(Graphics,boolean) at i.java:3237-3325 calls b(x,0,57,56,g) and
      b(x,112+extra,57,169-(112+extra),g) per entity column, but only inside
      `if (i.c)`. b(int,int,int,int,g) at i.java:3970-3984 tiles sprite 269
      between y=42 and y=126.
    javascript: >
      _fillTerrainBg() existed but was never called and used this.c.a(...)
      instead of the module resource facade c.a(...), so it threw immediately.
      It now routes through c.a(...), and _paintTerrainTexture() reproduces the
      two clipped strips per column. Because i.c is a save-data flag that the
      port never enables, the stage returns unless this.c === true. Forcing it
      in a normal game paints the fully opaque as.png over the horizon band and
      tree crowns, which is the reported wrong-texture/incomplete-horizon bug.
    impact: >
      The helper is functional and faithful, but sprite 269 is intentionally
      not drawn in a normal new game; enable this.c only for the matching state.
  - id: "horizon-visibility-conditional"
    severity: "visual-conditional"
    status: "faithful-to-java"
    java: >
      _renderTerrainInner() only draws sprites 360-374 when the clock-derived
      b1 is nonzero and not 1 (dusk/dawn buckets), and the horizontal position
      additionally depends on the numeric heading h.
    javascript: >
      At the initial state (this.i = 0, this.h = 0) b1 is 0, so no horizon
      sprites are drawn. Probes with this.i in {6, 18} and headings 1, 2, 3, 5,
      6 did draw horizon owners 48/49/50; heading 0 placed them off screen.
    impact: >
      The absence of time-of-day horizon sprites at game start is expected
      behavior, not a missing resource. The per-tile tufts added below are
      independent of this bucket and do draw at i=0.
  - id: "tuft-horizon-sprites"
    severity: "render"
    status: "resolved"
    java: >
      i.java:7425-7437 scatters horizon tufts into u[]/v[]/e[] while drawing a
      tile's decor strip, but only under i7===66 (a scanline count that never
      occurs with the real strip sizes). paintScreen() at i.java:5514-5525
      reads those arrays: d[b] gates drawing, e[b] selects o[j] (407-411) or
      p[j] (412-416), and j=(a+b*150)/175%o.length.
    javascript: >
      oVals/pVals were declared but never used, tuftY was an Int8Array (so the
      Java short range 103..169 overflowed negative), and the scatter branch
      was unreachable. _scatterCurrentTufts() now repopulates the buffers for
      the player's tile with a tile-seeded local RNG (it does not consume the
      gameplay Random this.a); _renderAll() stages it before _paintTufts(),
      which mirrors paintScreen() using tuftVisible[] for the java d[] flag.
    impact: >
      Fixed. CDP instrumentation confirmed three tuft draws per paint at the
      initial state (sprites 407/412/408, owner 57) and an 8-pixel delta
      against a paint with _paintTufts() stubbed out. The sprites are 10x1
      strips in the atlas, so the visual change is intentionally subtle.
  - id: "horizon-ground-bands"
    severity: "render"
    status: "resolved"
    java: >
      a(Graphics, boolean) calls d(Graphics) (sky) then c(Graphics) at
      i.java:3206-3208. c() paints two gradient bands between y=H (76) and
      y=169 using J=I*40/100=37: H..H+J and H+J..169.
    javascript: >
      The c() equivalent was missing, so rows 76..100 were left as bare sky.
      _paintGroundBands() now runs from _renderAll() right after
      _renderTerrain(), before tufts and entity/terrain columns.
    impact: >
      Fixed. CDP pixel probe at the initial state went from ~158 black pixels
      per row in y=76..100 to zero fully black rows in y=76..169; the ground
      renders as a dark olive/brown gradient.
  - id: "horizon-sprite-integer-math"
    severity: "render"
    status: "resolved"
    java: >
      a(Graphics, boolean) uses Java integer division: j = H * 70 / 100 and
      i4 = z / 90. Both facts select the horizon layout: j offsets the sky/ground
      bands, and i4 indexes the sprite table 363..374 for z/90 buckets 0,1,2,3,5,6,7.
    javascript: >
      _renderTerrainInner() used JavaScript `/` directly, so j and i4 were
      fractional for most H/z values. A fractional i4 never matches any switch
      case, so sprites 360-374 were silently skipped; a fractional j shifted the
      sky/ground gradient boundary. Applied Math.trunc() to both expressions so
      the division matches Java's truncation toward zero, keeping the existing
      b1/C/E/i===19 conditions untouched.
    impact: >
      The dusk/dawn horizon sprites (360-374) now select on integer z/90 buckets
      exactly like Java, without forcing sprite IDs or changing the clock.
  - id: "horizon-cabin-overlay-2026_11_21"
    severity: "render"
    status: "resolved"
    java: >
      b(byte,byte,...) at i.java:4279-4285 draws sprites 262-265 (house/rock
      bases), the black shadow at 4287, then 4521 twice. It never calls the
      overlay overload a(int,int,int,int,int,Graphics) at i.java:4313. Java
      calls that overlay only from the terrain-column path at i.java:4613,
      where the tile class gating already decides whether a building belongs
      there. The atlas shows sprite 266 as a cabin (triangular roof and door);
      262/263 are rock/blob bases.
    javascript: >
      _drawEntityMask() had an extra i._drawEntityOverlay.call(...) that drew
      the cabin from all eight entity columns (five near, three far). Because
      the entity columns are screen-space, the same cabin appeared at several
      distances as the player approached, even for tiles with no house. The
      call was removed; _drawEntityOverlay() remains called only from
      _drawTerrainColumnInner() (i.js:4162). _drawEntityHouse() still uses a
      tile-and-heading-seeded local LCG, so it does not consume this.a, and the
      hour only selects the night variants 264/265 as in Java.
    impact: >
      Node render probe: resource 18 (sprites 266-268) went from 8 draws in
      entity-mask pass 2 to zero, while resource 16 (panorama 235-243) stays at
      8 draws from terrain columns and sprites 360-374 are unchanged. No clock,
      movement, HUD or log changes; the only console.log in i.js remains the
      [mapa] sprite-move line.
  - id: "entity-offsets-table-2026_11_21"
    severity: "render"
    status: "resolved"
    java: >
      i.java:3998 builds the eight entity columns with
      (byte)(d + h.a[h][b*2]) / (byte)(e + h.a[h][b*2+1]). That h.a is the
      byte[][] at h.java:23-39: eight rows of sixteen small offsets (-2..2),
      one (dx,dy) pair per entity. The decompiler reuses the name `a` for the
      short[][] water bounds at h.java:61-79, which are unrelated.
    javascript: >
      _renderEntitiesInner() used hDayBounds (the water table) for entity
      placement. At spawn (13,29) facing 0 that produced tiles (48,92),
      (22,119), (48,129) ... — all outside the 30x40 map, so tileFieldBits()
      returned -1/6 and no rock/tree/cabin could ever be drawn around the
      player. Added hEntityOffsets with the real byte[][] values and switched
      both the five near-column and three far-column loops to it; hDayBounds
      stays where it belongs (water quads and terrain gradients).
      _drawEntityOverlay() and _drawEntityObject() also called the boolean
      _getTerrainColor() overload with (tileX,tileY,13,57344), so every tile
      looked like class 0 and sprite 266 was drawn unconditionally. They now
      use tileFieldBits(x,y,13,57344). The Java a(x,y,4) entity-list lookup
      has no port equivalent, so its bonus sprite stays off.
    impact: >
      Node sweep: resource 17 (262-265) is back — 2 draws at spawn (3,3) with
      type-6 tiles, 1 at (3,4), (3,5) and (3,15) — while resource 18 (266-268)
      stays at 0, panorama 16 remains at 8 draws and 360-374 are unchanged.
      No clock, movement, HUD or log changes; `node --check` and npm test
      (33/33) pass.
  - id: "tree-bush-decor-column-2026_11_21"
    severity: "render"
    status: "resolved"
    java: >
      i.java:4279-4285 (the entity mask) calls 4521 with paramBoolean=false at
      4284 for every entity column, and with true at 4283 when the column is
      66px tall. 4521-4659 is the only path that draws the tree/bush prefabs
      via drawSpriteLayer(i1,i2,h.f[strip],g) at 4655 (h.f = {10..0},
      h.java:107-109), plus the small ground sprites o/p/aTiles..hTiles at
      4620-4653. i.java:4042 also routes the player's own full-height column
      through the mask b(d,e,0,103,176,66,0,g), not the shadow a(...).
      The decompiler typed the strip index at 4601-4604 as a boolean, but it
      is a clamped 0..10 band number ((i2-H)/((169-H)/11)).
    javascript: >
      renderTileColumn() had bare module-scope names (a,b,d,e,h,H) that are
      never bound, so it always threw; _drawEntityMask() never called it and
      _renderEntitiesInner() sent pass 2 to _drawTerrainColumn() (the shadow)
      instead of the mask. Rewrote renderTileColumn() with this.tileFieldBits,
      this.drawHouseLayer, the h.f prefab pick and a tile-seeded local LCG
      (Java's shared visual Random `c` is not ported), keeping Java's guards,
      the 65% dusk bail-out, the per-type sprite pools and the 66px centre
      exclusion. Wired both paramBoolean variants into _drawEntityMask() and
      changed the pass-2 call to _drawEntityMask(d,e,0,103,176,66,0,g).
      The house overlay 266-268 is still NOT called from this path, so the
      false-cabin fix stays intact.
    impact: >
      Node sweep over 8 headings x 35 positions: resource 9 (sprites 106-143)
      now draws in 258/280 frames (0 before); resource 57 appears in the
      ground/decor pass, resource 17 rocks and panorama 16 are unchanged,
      resource 18 stays at 0 and sprites 360-374 are untouched. Spawn
      (13,29) facing 0 is a clearing (tile type 3) and correctly shows no
      tree; facing 5 shows 6 tree draws. `node --check` and npm test (33/33)
      pass; the only console.log in i.js remains the [mapa] line.
  - id: "graphics-3arg-setColor"
    severity: "render"
    status: "resolved"
    java: >
      javax.microedition.lcdui.Graphics defines setColor(int rgb) and
      setColor(int r, int g, int b); the game's gradient helpers call the
      three-argument form.
    javascript: >
      Graphics.setColor() in src/images/Graphics.js only accepted one argument,
      so setColor(r,g,b) silently became rgb=r and painted (0,0,r). The overload
      now packs r/g/b into the RGB integer.
    impact: >
      Fixed together with the ground bands; sky gradients and decor strips also
      use the correct channel order now.
  - id: "terrain-color-hour"
    severity: "render"
    status: "confirmed-in-source"
    javascript: >
      _getTerrainColor() compares the module identifier i with numeric hours;
      the instance clock is this.i.
    impact: "Color threshold selection may not follow the in-game time."
  - id: "duplicate-gradient-ports"
    severity: "render"
    status: "confirmed-divergence"
    javascript:
      terrain_helper: >
        _drawTileGradient() compares paramInt2 with H*70/100 using JavaScript
        floating-point arithmetic and uses deterministic variations for
        horizon detail. It also accesses this.h.a even though this.h is the
        numeric heading; the access fails and the local catch hides the
        exception, so that lateral scatter is skipped.
      entity_helper: >
        renderTileColumn16() applies integer coercions to emulate Java integer
        division and uses randomBetween() for variation.
    impact: >
      These are parallel implementations of the gradient with different
      behavior; do not assume both preserve the Java routine's result.
  - id: "random-int-source"
    severity: "gameplay-determinism"
    status: "confirmed-divergence"
    java: "randomInt(int, int, Random) uses the provided Random."
    javascript: "randomInt(lo, hi, rng) calculates with Math.random() and ignores rng."
    impact: >
      Results do not follow the same pseudorandom sequence as Java; results
      may vary between runs even when an RNG is provided.
  - id: "heading-and-light-selector"
    severity: "render-and-input"
    status: "confirmed-field-conflict"
    javascript: >
      this.h is initialized as a numeric heading, but some conditions
      interpret it as a lighting boolean. The bCam[8] path even toggles it
      with this.h = !this.h. renderCell20() selects the day/night tables
      using this same field.
    impact: >
      After the toggle, h is no longer a numeric heading and may select
      unexpected or invalid bounds/palettes.
  - id: "debug-tuft-rng"
    severity: "debug-only"
    status: "obsolete"
    javascript: >
      The old __WM_DEBUG_TUFTS toggle no longer exists. The scatter now runs
      unconditionally via _scatterCurrentTufts() and uses a tile-seeded local
      LCG instead of this.a, so it does not perturb gameplay randomness.
    impact: "None. No debug flag consumes the shared Random for tufts anymore."
  - id: "overlay-renderer-stub"
    severity: "incomplete-port"
    status: "stub"
    javascript: "_renderOverlay(g) is empty."
    impact: "Produces no drawing until implemented."

debug_controls:
  - flag: "__WM_DEBUG_AUTOMOVE"
    default: false
    effect: "Forces bCam[0] during update()."
  - flag: "__WM_DEBUG_DRAW"
    default: false
    effect: >
      Sprite/atlas instrumentation located in src/resources/c.js. i.js itself
      emits no render or HUD drawing and has a single console log, [mapa],
      reported once per completed map-sprite step.

maintenance_notes:
  - "Use i.java as a reference for intent, but verify each call against its signature and actual state."
  - "Do not mechanically convert all ported static methods into instance methods."
  - "When changing rendering, review silent catches and test the result in the browser."
  - "Recheck cited lines and expressions if i.js or i.java is restructured."

overload_rename_pass:
  date: "2026-11-16"
  scope: >
    Name-only pass. Logic, argument order, game state, and the screen's public
    API were not changed. The goal was to have render calls target existing
    methods with unique names, without attempting to fix the bugs described
    in nuevo.txt.
  reason: >
    JavaScript does not support signature-based overloading. The port retained
    Java signatures as uniquely named methods (readTileBits, _lineIntersect,
    randomBetween, showMessageDialog, ...), but many call sites still invoked
    bare Java names such as a(...), b(...), c(...). Those identifiers exist as
    uninitialized module variables (i.js:12-17), so the call throws a
    ReferenceError inside an empty try/catch and becomes a silent no-op. This
    is why the drawing path produces no output even though the paint loop runs.
  untouched_public_api:
    - "paintScreen"
    - "update"
    - "screenEntered"
    - "keyPressed"
    - "resetGameState"
    - "_paintEntry"
    - "_renderAll"
    - "_renderTerrain"
    - "_renderUI"
